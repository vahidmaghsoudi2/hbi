name: HBI CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Compile application and test Python files
        run: python -m compileall app tests

      - name: Compile G8 regression runner
        run: python -m py_compile scripts/run_g8_regression_bundle.py

      - name: Run G8 regression bundle
        run: python scripts/run_g8_regression_bundle.py

      - name: Upload G8 regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8-regression-evidence-${{ github.sha }}
          path: /tmp/hbi-g8-regression-evidence/
          if-no-files-found: warn

      - name: Run tests with strict coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html -v

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload coverage reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: |
            htmlcov/
            coverage.xml

  # Run the real API startup path against a disposable SQLite database.
  # This is a smoke test only; it does not create products or certify G8 A1-A9.
  g8-isolated-pilot-smoke:
    name: g8-isolated-pilot-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile isolated pilot runner
        run: python -m py_compile scripts/run_g8_isolated_pilot.py

      - name: Start API with disposable database and verify health
        run: python scripts/run_g8_isolated_pilot.py --smoke-test

      - name: Upload isolated pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8-isolated-pilot-smoke-${{ github.sha }}
          path: /tmp/hbi-g8-pilot-evidence/
          if-no-files-found: error

  # WP-06 / Issue #20: dedicated governance gate for P4 Contract §16–§18
  # Justification: stable named status check for future branch protection;
  # faster targeted feedback without re-running accounting/inventory suites.
  # Scope files are the P4 compliance + API auth matrix suites on master.
  governance-tests:
    name: governance-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run P4 governance test suites
        run: python -m pytest -q tests/test_product_compliance.py tests/test_wp05_api_auth_matrix.py --tb=short
